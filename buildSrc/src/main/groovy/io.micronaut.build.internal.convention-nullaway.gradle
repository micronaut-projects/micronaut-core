import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id "io.micronaut.build.internal.base"
    id 'net.ltgt.errorprone'
}

dependencies {
    errorprone libs.nullaway
    errorprone libs.error.prone.core
}

tasks.withType(JavaCompile).configureEach {
    boolean testCompile = name.toLowerCase().contains("test")
    options.errorprone {
        check("NullAway", CheckSeverity.ERROR)
        check("MissingOverride", CheckSeverity.ERROR)
        // Every package is @NullMarked or @NullUnmarked, enforced by RequireExplicitNullMarking
        option("NullAway:OnlyNullMarked", "true")
        check("RequireExplicitNullMarking", CheckSeverity.ERROR)
        // Verify @Contract annotations instead of trusting them
        option("NullAway:CheckContracts", "true")
        // Check overrides of library methods against the overridden signature
        option("NullAway:ExhaustiveOverride", "true")
        // Honor @Nullable returns and @NonNull parameters declared in library bytecode
        option("NullAway:AcknowledgeRestrictiveAnnotations", "true")
        if (!testCompile) {
            // Error Prone checks that fail the build of main code, the TCKs included
            check("ClassInitializationDeadlock", CheckSeverity.ERROR)
            check("DoubleCheckedLocking", CheckSeverity.ERROR)
            check("BadInstanceof", CheckSeverity.ERROR)
            check("DefaultCharset", CheckSeverity.ERROR)
            check("StringCaseLocaleUsage", CheckSeverity.ERROR)
        }
    }
    // Disable NullAway on test code and TCK
    if (testCompile || project.name.contains("tck")) {
        options.errorprone {
            disable("NullAway", "RequireExplicitNullMarking")
        }
    }
}

