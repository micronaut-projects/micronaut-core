plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation libs.htmlsanitycheck
    implementation(providers.gradleProperty("micronaut-build-version").map { "io.micronaut.build.internal:micronaut-gradle-plugins:${it}" }.get())
    implementation libs.tomlj
    implementation libs.japicmp.gradle.plugin
    implementation libs.native.gradle.plugin
    implementation libs.sonatype.scan
    implementation libs.gradle.errorprone
}
