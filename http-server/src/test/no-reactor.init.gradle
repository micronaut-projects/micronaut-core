// Local binder validation only: leave compilation and normal test discovery unchanged.
gradle.projectsEvaluated {
    def target = gradle.rootProject.findProject(':micronaut-http-server')
    if (target == null) return
    target.tasks.register('reactorAbsentBinderProbe', JavaExec) {
        dependsOn target.tasks.named('testClasses')
        classpath = target.sourceSets.test.runtimeClasspath.filter {
            !it.name.startsWith('reactor-core-') && !it.name.startsWith('micronaut-reactor-')
        }
        mainClass = 'io.micronaut.http.server.binding.ReactorAbsentBinderProbe'
    }
}
