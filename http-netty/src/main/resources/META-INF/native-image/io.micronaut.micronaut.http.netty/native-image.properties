# needed until GraalVM patch for MemorySegment, see https://github.com/oracle/graalvm-reachability-metadata/pull/642
# TypeParameterMatcher: the metadata repository registers typeReached conditions on it, and GraalVM 25.0
# simulates its initializer inconsistently across concurrent clusters, failing the build with
# "mismatch with existing registration". Fixed upstream in https://github.com/oracle/graal/pull/14154
Args = --initialize-at-build-time=io.netty.util.internal.CleanerJava25 \
       --initialize-at-run-time=io.netty.util.internal.TypeParameterMatcher
