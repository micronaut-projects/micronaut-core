String versionFromCatalog(String path, String key) {
    def catalog = file(path)
    def matcher = catalog.text =~ "(?m)^${java.util.regex.Pattern.quote(key)}\\s*=\\s*\"([^\"]+)\""
    if (!matcher.find()) {
        throw new org.gradle.api.GradleException("Unable to find version '$key' in ${catalog.absolutePath}")
    }
    matcher.group(1)
}

boolean isSnapshotVersion(String version) {
    version.endsWith("-SNAPSHOT")
}

Boolean booleanGradleProperty(String name) {
    def value = providers.gradleProperty(name).orNull
    if (value == null) {
        return null
    }
    def normalized = value.trim()
    if (normalized == "true") {
        return true
    }
    if (normalized == "false") {
        return false
    }
    throw new org.gradle.api.GradleException("Expected Gradle property '$name' to be 'true' or 'false' but got '$value'")
}

String firstGradleProperty(String... names) {
    for (String name : names) {
        def value = providers.gradleProperty(name).orNull
        if (value != null && !value.isBlank()) {
            return value
        }
    }
    null
}

String runCommand(File workingDir, String... command) {
    def output = new ByteArrayOutputStream()
    def process = new ProcessBuilder(command)
        .directory(workingDir)
        .redirectErrorStream(true)
        .start()
    process.inputStream.withStream { input ->
        output << input
    }
    if (process.waitFor() != 0) {
        def message = new StringBuilder("Command failed in ${workingDir.absolutePath}: ${command.join(' ')}")
        def text = output.toString("UTF-8").trim()
        if (!text.isEmpty()) {
            message.append("\n").append(text)
        }
        throw new org.gradle.api.GradleException(message.toString())
    }
    output.toString("UTF-8").trim()
}

boolean mavenVersionDirReady(File versionDir, String artifactId) {
    if (!versionDir.isDirectory()) {
        return false
    }
    if (new File(versionDir, "${artifactId}-${versionDir.name}.pom").isFile()) {
        return true
    }
    versionDir.listFiles()?.any { candidate ->
        candidate.isFile() &&
            candidate.name.startsWith("${artifactId}-") &&
            (candidate.name.endsWith(".pom") || candidate.name.endsWith(".jar"))
    } == true
}

boolean graalPyBundleReady(File repoDir, String graalpyVersion) {
    mavenVersionDirReady(new File(repoDir, "org/graalvm/polyglot/polyglot/$graalpyVersion"), "polyglot") &&
        mavenVersionDirReady(new File(repoDir, "org/graalvm/polyglot/python/$graalpyVersion"), "python") &&
        mavenVersionDirReady(new File(repoDir, "org/graalvm/python/python/$graalpyVersion"), "python") &&
        mavenVersionDirReady(new File(repoDir, "org/graalvm/python/python-launcher/$graalpyVersion"), "python-launcher") &&
        mavenVersionDirReady(new File(repoDir, "org/graalvm/python/python-bouncycastle-support/$graalpyVersion"), "python-bouncycastle-support")
}

boolean graalPyExtensionsReady(File repoDir, String graalpyVersion) {
    def pythonVersionDir = new File(repoDir, "org/graalvm/python/python/$graalpyVersion")
    def embeddingVersionDir = new File(repoDir, "org/graalvm/python/python-embedding/$graalpyVersion")
    def embeddingToolsVersionDir = new File(repoDir, "org/graalvm/python/python-embedding-tools/$graalpyVersion")
    mavenVersionDirReady(pythonVersionDir, "python") &&
        mavenVersionDirReady(embeddingVersionDir, "python-embedding") &&
        mavenVersionDirReady(embeddingToolsVersionDir, "python-embedding-tools")
}

boolean isValidZip(File file) {
    if (!file.isFile() || file.length() == 0L) {
        return false
    }
    try {
        new java.util.zip.ZipFile(file).withCloseable { zip ->
            zip.entries().hasMoreElements()
        }
    } catch (Exception ignored) {
        false
    }
}

String xmlEscape(String value) {
    value
        .replace("&", "&amp;")
        .replace("<", "&lt;")
        .replace(">", "&gt;")
        .replace("\"", "&quot;")
        .replace("'", "&apos;")
}

File writeGraalPyBundleMavenSettings(File repoDir, String checkoutSha) {
    def settingsFile = file("checkouts/maven-bundles/graalpy/${checkoutSha}-settings.xml")
    settingsFile.parentFile.mkdirs()
    def repoUrl = xmlEscape(repoDir.toURI().toString())
    settingsFile.text = """<?xml version="1.0" encoding="UTF-8"?>
<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
  <profiles>
    <profile>
      <id>micronaut-graalpy-bundle</id>
      <repositories>
        <repository>
          <id>micronaut-graalpy-bundle</id>
          <url>${repoUrl}</url>
          <releases>
            <enabled>true</enabled>
          </releases>
          <snapshots>
            <enabled>true</enabled>
          </snapshots>
        </repository>
      </repositories>
      <pluginRepositories>
        <pluginRepository>
          <id>micronaut-graalpy-bundle</id>
          <url>${repoUrl}</url>
          <releases>
            <enabled>true</enabled>
          </releases>
          <snapshots>
            <enabled>true</enabled>
          </snapshots>
        </pluginRepository>
      </pluginRepositories>
    </profile>
  </profiles>
  <activeProfiles>
    <activeProfile>micronaut-graalpy-bundle</activeProfile>
  </activeProfiles>
</settings>
"""
    settingsFile
}

String resolveGraalPyBundleUrl(String graalpyVersion) {
    def configuredUrl = firstGradleProperty("micronaut.graalpy.bundle.url", "pyronaut.graalpy.bundle.url")
    if (configuredUrl != null) {
        return configuredUrl
    }

    def releaseVersion = graalpyVersion - "-SNAPSHOT"
    def releasesJson = runCommand(
        settingsDir,
        "curl",
        "-sSL",
        "https://api.github.com/repos/graalvm/oracle-graalvm-ea-builds/releases"
    )
    def pattern = ~/https:\/\/github\.com\/graalvm\/oracle-graalvm-ea-builds\/releases\/download\/[^"\s]+\/maven-resource-bundle-${java.util.regex.Pattern.quote(releaseVersion)}[^"\s]*\.zip/
    def matcher = releasesJson =~ pattern
    if (!matcher.find()) {
        throw new org.gradle.api.GradleException("Unable to find a GraalPy Maven bundle release for version $graalpyVersion")
    }
    matcher.group(0)
}

boolean isUsableGitCheckout(File directory) {
    if (!directory.isDirectory() || !new File(directory, ".git").exists()) {
        return false
    }
    try {
        runCommand(directory, "git", "rev-parse", "--verify", "HEAD")
        true
    } catch (org.gradle.api.GradleException ignored) {
        false
    }
}

void deleteRecursively(File target) {
    if (!target.exists()) {
        return
    }
    def paths = java.nio.file.Files.walk(target.toPath())
    try {
        paths.sorted(java.util.Comparator.reverseOrder()).forEach { path ->
            java.nio.file.Files.deleteIfExists(path)
        }
    } finally {
        paths.close()
    }
}

File ensureGraalPyExtensionsCheckout() {
    def localOverride = firstGradleProperty("local.git.graalpy-extensions")
    if (localOverride != null) {
        def localDir = file(localOverride)
        if (!isUsableGitCheckout(localDir)) {
            throw new org.gradle.api.GradleException("Configured local.git.graalpy-extensions path is not a valid git checkout: ${localDir.absolutePath}")
        }
        return localDir
    }

    def checkoutDir = file("checkouts/graalpy-extensions")
    if (isUsableGitCheckout(checkoutDir)) {
        return checkoutDir
    }
    deleteRecursively(checkoutDir)
    checkoutDir.parentFile.mkdirs()
    runCommand(
        settingsDir,
        "git",
        "clone",
        "--depth",
        "1",
        "--branch",
        "main",
        "https://github.com/oracle/graalpy-extensions.git",
        checkoutDir.absolutePath
    )
    checkoutDir
}

File ensureGraalPyBundleRepo(File checkoutDir, String graalpyVersion) {
    def explicitRepo = firstGradleProperty("micronaut.graalpy.bundle.repo", "pyronaut.graalpy.bundle.repo")
    if (explicitRepo != null) {
        def repoDir = file(explicitRepo)
        if (!graalPyExtensionsReady(repoDir, graalpyVersion)) {
            throw new org.gradle.api.GradleException(
                "Configured GraalPy bundle repo does not contain GraalPy embedding artifacts for $graalpyVersion: ${repoDir.absolutePath}"
            )
        }
        return repoDir
    }

    def checkoutSha = runCommand(checkoutDir, "git", "rev-parse", "--verify", "HEAD").readLines().last().trim()
    def repoDir = file("checkouts/maven-bundles/graalpy/$checkoutSha")
    if (graalPyExtensionsReady(repoDir, graalpyVersion)) {
        return repoDir
    }

    if (!graalPyBundleReady(repoDir, graalpyVersion)) {
        repoDir.mkdirs()
        def bundleUrl = resolveGraalPyBundleUrl(graalpyVersion)
        def zipFile = file("checkouts/maven-bundles/graalpy/${checkoutSha}.zip")
        zipFile.parentFile.mkdirs()
        def leftoverZip = new File(checkoutDir, "maven-resource-bundle.zip")
        if (isValidZip(leftoverZip) && !zipFile.exists()) {
            java.nio.file.Files.move(leftoverZip.toPath(), zipFile.toPath())
        }
        if (!isValidZip(zipFile)) {
            zipFile.delete()
            runCommand(settingsDir, "curl", "-L", "-o", zipFile.absolutePath, bundleUrl)
        }
        runCommand(settingsDir, "unzip", "-q", "-o", zipFile.absolutePath, "-d", repoDir.absolutePath)
        zipFile.delete()
    }

    if (!graalPyBundleReady(repoDir, graalpyVersion)) {
        throw new org.gradle.api.GradleException(
            "GraalPy bundle bootstrap completed without publishing runtime artifacts for $graalpyVersion to ${repoDir.absolutePath}"
        )
    }

    if (!graalPyExtensionsReady(repoDir, graalpyVersion)) {
        def settingsFile = writeGraalPyBundleMavenSettings(repoDir, checkoutSha)
        runCommand(
            checkoutDir,
            "./mvnw",
            "-s",
            settingsFile.absolutePath,
            "-pl",
            "org.graalvm.python.embedding,org.graalvm.python.embedding.tools",
            "-am",
            "install",
            "-Dmaven.test.skip=true",
            "-DskipTests",
            "-DskipITs",
            "-DskipSigtest=true",
            "-Dspotbugs.skip=true",
            "-Dcheckstyle.skip=true",
            "-Dmaven.javadoc.skip=true",
            "-Dmaven.repo.local=${repoDir.absolutePath}",
            "-Dlocal.repo.url=${repoDir.toURI()}"
        )
    }

    if (!graalPyExtensionsReady(repoDir, graalpyVersion)) {
        throw new org.gradle.api.GradleException(
            "GraalPy extensions bootstrap completed without publishing embedding artifacts for $graalpyVersion to ${repoDir.absolutePath}"
        )
    }
    repoDir
}

def graalpyVersion = versionFromCatalog("gradle/libs.versions.toml", "managed-graalpy")
def includeGraalPyExtensionsProperty = booleanGradleProperty("micronaut.include.graalpy.extensions")
def includeGraalPyExtensions = includeGraalPyExtensionsProperty != null ? includeGraalPyExtensionsProperty : isSnapshotVersion(graalpyVersion)
def graalPyBundleRepo = includeGraalPyExtensions ?
    ensureGraalPyBundleRepo(ensureGraalPyExtensionsCheckout(), graalpyVersion).tap {
        System.setProperty("micronaut.graalpy.bundle.repo", it.absolutePath)
    } :
    null

dependencyResolutionManagement {
    repositories {
        if (graalPyBundleRepo != null) {
            maven {
                name = "graalPyBundle"
                url = graalPyBundleRepo.toURI()
                content {
                    includeGroupByRegex("org\\.graalvm(\\..*)?")
                }
            }
        }
        mavenCentral()
    }
}

