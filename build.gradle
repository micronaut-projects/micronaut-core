import io.micronaut.build.docs.PublishGuideTask
import org.gradle.api.tasks.PathSensitivity

plugins {
    id "io.micronaut.build.internal.parent"
    id "io.micronaut.build.internal.dependency-updates"
    id "io.micronaut.build.internal.version-catalog-updates"
    id "io.micronaut.build.internal.convention-quality"
    alias(libs.plugins.managed.kotlin.jvm) apply false
    alias(libs.plugins.managed.kotlin.allopen) apply false
    alias(libs.plugins.managed.kotlin.kapt) apply false
    alias(libs.plugins.managed.kotlin.noarg) apply false
    alias(libs.plugins.managed.ksp) apply false
}

repositories {
    mavenCentral()
}

def languageSnippetSources = files(
        fileTree("test-suite/src/test/java") {
            include "**/*.java"
        },
        fileTree("test-suite-groovy/src/test/groovy") {
            include "**/*.groovy"
        },
        fileTree("test-suite-kotlin/src/test/kotlin") {
            include "**/*.kt"
        },
        fileTree("test-suite-python/src/test/python") {
            include "**/*.py"
        }
)

tasks.withType(PublishGuideTask).configureEach {
    inputs.files(languageSnippetSources)
            .withPropertyName("languageSnippetSources")
            .withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.named("updateVersionCatalogs") {
    // we set the list to empty because we accept upgrades which improve the status
    rejectedQualifiers = []
    // Invalid POM files
    ignoredModules.add("io.micronaut.ignite:micronaut-ignite-core")
    ignoredModules.add("io.micronaut.ignite:micronaut-ignite-cache")
    // workaround Gradle variant selection problem
    ignoredModules.add("com.github.ben-manes.caffeine:caffeine")
}

def pythonProjects = [
        ":micronaut-inject-python",
        ":micronaut-inject-python-test",
        ":micronaut-context-python",
        ":micronaut-context-python-netty",
        ":test-suite-python"
]

if (System.getenv("SONAR_TOKEN") != null) {
    // deprecated and compile time only classes excluded from analysis
    def analysisExcludes = [
        "**/StreamSoftServiceLoader.java",
        "**/ServiceDescriptionProcessor.java",
        "**/GraalReflectionConfigurer.java",
        "**/graal/ServiceLoaderInitialization.java",
        "**/graal/ServiceLoaderInitialization.java",
        "**/DirectoryClassWriterOutputVisitor.java",
        "**/GroovyClassWriterOutputVisitor.java",
        "**/MutableHttpRequestWrapper.java",
        "**/tck/**",
        "**/test/support/**",
        "**/micronaut/annotation/processing/test/**"
    ]
    // Python module tests run in a separate CI workflow without Sonar coverage collection.
    def pythonCoverageExcludes = pythonProjects.collect {
        "${project(it).projectDir.name}/**/*"
    }
    // GraalVM Feature code only ever executes during native image generation, so it can never be
    // covered by the JVM test suite. It is still analysed for issues, just not for coverage.
    def coverageExcludes = pythonCoverageExcludes + [
        "**/ServiceLoaderFeature.java"
    ]
    sonarqube {
        skipProject = project.name.contains("test")
        properties {
            property "sonar.exclusions", analysisExcludes.join(",")
            property "sonar.coverage.exclusions", coverageExcludes.join(",")
        }
    }
}

configurations.jacocoAggregation.dependencies.removeIf {
    it instanceof ProjectDependency && it.path.startsWith(":test-")
}
configurations.javadocAggregatorBase.dependencies.removeIf {
    it instanceof ProjectDependency && it.path.startsWith(":test-")
}

if (!providers.gradleProperty("python-ci").isPresent()) {
    subprojects { project ->
        if (project.path in pythonProjects) {
            project.tasks.withType(Test).configureEach {
                enabled = false
            }
        }
    }
}
