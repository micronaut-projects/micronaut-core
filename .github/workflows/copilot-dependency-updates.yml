# Replaces Renovate's pull requests: reads the Renovate Dependency Dashboard,
# lets a Copilot CLI session make and verify each update, and opens a pull
# request that follows the branch policy in .github/copilot-dependency-policy.json.
#
# Policy
#  - a branch whose minor is released (tag vX.Y.0 exists) takes patch updates
#    only; an unreleased minor takes minor and patch updates; never majors
#  - a change that only moves versions, passes verification and is not on the
#    manual review list is auto-merged once the required checks pass
#  - a change that also edits sources, or a listed package, waits for review
#  - a change that fails verification opens as a draft
#  - a change outside the policy opens no pull request
#
# Jobs
#  - plan: reads the dashboard and works out each branch's policy
#  - update: the Copilot session. It runs build code it may have written, so
#    it gets no repository token or git credentials and only produces a patch
#  - publish: a clean runner applies the patch, classifies it and pushes
#
# Secrets
#  - COPILOT_GITHUB_TOKEN: fine-grained PAT with the "Copilot Requests" permission
#  - DEPENDENCY_UPDATES_TOKEN: token that pushes branches and opens pull
#    requests (contents, pull requests and issues write). GITHUB_TOKEN cannot be
#    used: its pushes do not trigger the Java CI checks auto-merge waits on.
name: Copilot dependency updates
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: 'Comma separated base branches (default: the default branch and newer X.Y.x branches)'
        required: false
      only:
        description: 'Regex over the Renovate branch and title, e.g. slf4j|logback'
        required: false
      max:
        description: 'Maximum updates in this run (default from the policy)'
        required: false
      dashboard:
        description: 'Dependency Dashboard issue number (default: found by title)'
        required: false
      model:
        description: 'Copilot model (default: the CLI default)'
        required: false
      dry-run:
        description: 'Make, verify and classify the updates, but push nothing'
        type: boolean
        default: false
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository_owner == 'micronaut-projects'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: "📥 Checkout workflow tooling"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: "📋 Read the Dependency Dashboard"
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCHES: ${{ inputs.branches }}
          ONLY: ${{ inputs.only }}
          MAX_UPDATES: ${{ inputs.max }}
          DASHBOARD_ISSUE: ${{ inputs.dashboard }}
        run: python3 .github/scripts/copilot-deps.py plan

  update:
    name: "update ${{ matrix.id }}"
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # the organisation shares one pool of hosted runners
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - name: "🔎 Look for an earlier pull request"
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ matrix.head }}
          TARGET: ${{ matrix.target }}
        run: |
          # the same target is already proposed, or a person closed it unmerged
          same=0
          if [ -n "$TARGET" ]; then
            same=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD" --state all --json state,body --limit 20 \
              | jq --arg m "<!-- copilot-deps target=$TARGET -->" '[.[] | select((.body | contains($m)) and .state != "MERGED")] | length')
          fi
          echo "skip=$([ "$same" != 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: "🗑 Free disk space"
        if: steps.existing.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/ghc /usr/share/dotnet /usr/local/lib/android
          sudo apt-get clean

      - name: "📥 Checkout ${{ matrix.base }}"
        if: steps.existing.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.base }}
          persist-credentials: false

      - name: "📥 Checkout workflow tooling"
        if: steps.existing.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .copilot-deps-tools
          sparse-checkout: .github
          persist-credentials: false

      - name: "📌 Record the base"
        if: steps.existing.outputs.skip != 'true'
        id: base
        run: |
          mv .copilot-deps-tools "$RUNNER_TEMP/tools"
          mkdir -p "$RUNNER_TEMP/out" build/copilot-deps
          git rev-parse HEAD > "$RUNNER_TEMP/out/base-sha"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "🔧 Setup GraalVM CE"
        if: steps.existing.outputs.skip != 'true'
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          distribution: 'graalvm'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup Gradle"
        if: steps.existing.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: "🔧 Install Copilot CLI"
        if: steps.existing.outputs.skip != 'true'
        run: npm install -g @github/copilot@1

      - name: "🤖 Update with Copilot"
        if: steps.existing.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 120
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TASK: ${{ toJSON(matrix) }}
          MODEL: ${{ inputs.model }}
          # inside the workspace, where Copilot may write; build/ is ignored by git
          REPORT: build/copilot-deps/report.md
        run: |
          python3 "$RUNNER_TEMP/tools/.github/scripts/copilot-deps.py" prompt > "$RUNNER_TEMP/out/prompt.md"
          copilot -p "$(cat "$RUNNER_TEMP/out/prompt.md")" \
            ${MODEL:+--model "$MODEL"} \
            --no-ask-user \
            --share "$RUNNER_TEMP/out/session.md" \
            --allow-tool=write \
            --allow-tool='shell(./gradlew:*)' \
            --allow-tool='shell(python3:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='shell(ls:*)' \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(git diff:*)' \
            --allow-tool='shell(git status:*)' \
            --allow-tool='shell(git log:*)' \
            --allow-tool='shell(git show:*)' \
            --allow-tool='shell(git checkout:*)' \
            --deny-tool='shell(git push)' \
            --deny-tool='shell(git commit)' \
            2>&1 | tee "$RUNNER_TEMP/out/copilot.log"

      - name: "🛠 Verify"
        if: steps.existing.outputs.skip != 'true'
        id: verify
        continue-on-error: true
        run: |
          tasks=$(jq -r .verifyTasks "$RUNNER_TEMP/tools/.github/copilot-dependency-policy.json")
          ./gradlew $tasks --no-daemon --continue

      - name: "📦 Save the change"
        if: steps.existing.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          cp build/copilot-deps/report.md "$RUNNER_TEMP/out/report.md" 2>/dev/null || true
          echo "$VERIFY_OUTCOME" > "$RUNNER_TEMP/out/verify"
          git add -A
          git diff --cached --binary "$BASE_SHA" > "$RUNNER_TEMP/out/change.patch"
          git diff --cached --stat "$BASE_SHA"

      - name: "📤 Upload the change"
        if: steps.existing.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  publish:
    name: "publish ${{ matrix.id }}"
    needs: [plan, update]
    if: always() && needs.plan.outputs.count != '0' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: "📥 Download the change"
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/in

      - name: "📥 Checkout ${{ matrix.base }}"
        if: steps.download.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.base }}
          fetch-depth: 50
          persist-credentials: false

      - name: "📥 Checkout workflow tooling"
        if: steps.download.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .copilot-deps-tools
          sparse-checkout: .github
          persist-credentials: false

      - name: "🩹 Apply the change"
        if: steps.download.outcome == 'success'
        id: apply
        run: |
          mv .copilot-deps-tools "$RUNNER_TEMP/tools"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/in/change.patch" ]; then
            git apply --3way --index --binary "$RUNNER_TEMP/in/change.patch"
          fi

      - name: "⚖️ Classify against the policy"
        if: steps.download.outcome == 'success'
        id: classify
        env:
          BASE_REF: ${{ steps.apply.outputs.sha }}
          TASK: ${{ toJSON(matrix) }}
        run: |
          export VERIFY_OUTCOME=$(cat "$RUNNER_TEMP/in/verify" 2>/dev/null || echo failure)
          python3 "$RUNNER_TEMP/tools/.github/scripts/copilot-deps.py" classify

      - name: "📤 Push and open the pull request"
        if: >-
          steps.download.outcome == 'success' && !inputs.dry-run &&
          contains(fromJSON('["automerge","review","failed"]'), steps.classify.outputs.status)
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATES_TOKEN }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          STATUS: ${{ steps.classify.outputs.status }}
          UPDATE_TYPE: ${{ steps.classify.outputs.update_type }}
          TITLE: ${{ steps.classify.outputs.title }}
          CHANGES: ${{ steps.classify.outputs.changes }}
          REASONS: ${{ steps.classify.outputs.reasons }}
          DASHBOARD_TITLE: ${{ matrix.title }}
          TARGET: ${{ matrix.target }}
          COMMIT_EMAIL: ${{ vars.DEPENDENCY_UPDATES_EMAIL || 'micronaut-build@users.noreply.github.com' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "micronaut-build"
          git config user.email "$COMMIT_EMAIL"
          git commit -q -m "$TITLE" -m "$DASHBOARD_TITLE"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$HEAD"

          {
            echo "<!-- copilot-deps target=$TARGET -->"
            echo "Dependency update prepared by Copilot from the Renovate Dependency Dashboard entry:"
            echo
            echo "> $DASHBOARD_TITLE"
            echo
            echo "**Policy:** \`$STATUS\` ($UPDATE_TYPE update on \`$BASE\`)"
            echo
            echo "$REASONS"
            echo
            echo "$CHANGES"
            echo
            echo "## Copilot report"
            echo
            cat "$RUNNER_TEMP/in/report.md" 2>/dev/null || echo "_Copilot wrote no report; see the workflow run._"
            echo
            echo "---"
            echo "[Workflow run]($RUN_URL)"
          } > "$RUNNER_TEMP/body.md"

          for label in "copilot-deps: automerge:0e8a16" "copilot-deps: review:fbca04" "copilot-deps: failed:d93f0b"; do
            gh label create "${label%:*}" --color "${label##*:}" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          done
          label="copilot-deps: $STATUS"

          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD" --state open --json number --jq '.[0].number // ""')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md" \
              --remove-label "copilot-deps: automerge,copilot-deps: review,copilot-deps: failed" --add-label "$label"
            if [ "$STATUS" = failed ]; then
              gh pr ready "$number" --repo "$GITHUB_REPOSITORY" --undo || true
            else
              gh pr ready "$number" --repo "$GITHUB_REPOSITORY" || true
            fi
          else
            draft=()
            [ "$STATUS" = failed ] && draft=(--draft)
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$HEAD" --title "$TITLE" \
              --body-file "$RUNNER_TEMP/body.md" --label "type: dependency-upgrade" --label "$label" "${draft[@]}")
            number=${url##*/}
          fi

          if [ "$STATUS" = automerge ]; then
            # waits for the branch's required status checks
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --auto --squash \
              || gh pr comment "$number" --repo "$GITHUB_REPOSITORY" \
                   --body "The policy allows auto-merge, but it could not be enabled. Is \"Allow auto-merge\" on for this repository?"
          else
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --disable-auto 2>/dev/null || true
          fi
          echo "Pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number" >> "$GITHUB_STEP_SUMMARY"
