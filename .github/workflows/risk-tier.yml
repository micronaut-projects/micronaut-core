# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
name: Risk tier
# Labels each pull request with its risk tier (risk-tier: T0, T1 or T2), classified by TypeSafe's Jev model through
# .github/scripts/risk-tier.py, and its AI use (ai-use: none, assisted or agent-generated) as declared. The rules are in
# .github/risk-tiers.global.toml, fetched from micronaut-project-template's default branch on every run, overwritten by
# the repository's own optional .github/risk-tiers.toml. A
# change under a T2 path, a T2 label such as type: breaking, or a declared API change is always T2. Relabelling reclassifies a pull request: labels added by anyone else are kept. The check fails when the
# tier declared in the pull request description is lower than the classified one, or when Jev cannot be reached. The
# tiers are described in MAINTAINING.md, under "Risk tiers and AI disclosure".
#
# Jev's API key is the TYPESAFE_API_KEY organisation secret. Jev receives the pull request title, description, labels,
# changed file names with line counts, and the changed lines of main source files, read through the GitHub API.
#
# It runs on pull_request_target so that it can label pull requests from forks. It must never check out or run
# pull request code: the checkout below is the base branch, and the changed paths come from the GitHub API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-tier:
    name: risk-tier
    # Label events caused by this workflow's own token do not start new runs, so the job only reacts
    # to label changes made by people or other automation.
    # Draft pull requests are not classified: most pushes happen while a pull request is a draft, and it is
    # classified once it is marked ready for review.
    if: >-
      github.repository_owner == 'micronaut-projects' &&
      !github.event.pull_request.draft &&
      (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
       startsWith(github.event.label.name, 'risk-tier: ') ||
       startsWith(github.event.label.name, 'ai-use: ') ||
       github.event.label.name == 'type: breaking')
    runs-on: ubuntu-latest
    permissions:
      # Reads the artifact that keeps Jev's last answer.
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: "📥 Checkout base branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base branch, never the pull request head.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/risk-tier.py
            .github/risk-tiers.toml
          sparse-checkout-cone-mode: false
      - name: "📥 Fetch the global rules from the template"
        # Not synced: every repository reads the template's current rules, so a change there applies at once. The
        # job fails if they cannot be fetched, instead of classifying without them.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: micronaut-projects/micronaut-project-template
          ref: master
          path: .risk-tier-template
          persist-credentials: false
          sparse-checkout: .github/risk-tiers.global.toml
          sparse-checkout-cone-mode: false
      - name: "🏷 Compute and label the risk tier"
        id: classify
        env:
          RISK_TIER_STATE: .risk-tier-state
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 .github/scripts/risk-tier.py --rules .risk-tier-template/.github/risk-tiers.global.toml event
      - name: "📦 Keep Jev's answer for the next run"
        # The next run reads the newest artifact of this name that a pull_request_target run of this workflow
        # uploaded, and reuses the answer while the title, description and set of changed files are the same. The
        # Actions cache cannot be written from pull_request_target.
        if: always() && steps.classify.outputs.save-state == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: risk-tier-state-${{ github.event.pull_request.number }}
          path: .risk-tier-state/state.json
          retention-days: 30
          if-no-files-found: error

  review-policy:
    name: review-policy
    # Whether the pull request has the reviews its risk tier needs (see MAINTAINING.md, "Review policy"), checked once
    # the labels are set. It runs whether the risk-tier job ran, failed or was skipped, so that a skipped run never
    # reports a pass: it reads the labels the pull request carries. A cancelled run, superseded by a newer one, does
    # not run it. Reviews re-run it through review-policy.yml, whose job has the same name, so the latest result counts.
    needs: risk-tier
    if: ${{ !cancelled() && github.repository_owner == 'micronaut-projects' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads reviews, and requests a review from the maintainers rotation.
      pull-requests: write
    steps:
      - name: "📥 Checkout base branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base branch, never the pull request head.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/risk-tier.py
            .github/risk-tiers.toml
            .github/CODEOWNERS
            CODEOWNERS
            docs/CODEOWNERS
          sparse-checkout-cone-mode: false
      - name: "📥 Fetch the global rules from the template"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: micronaut-projects/micronaut-project-template
          ref: master
          path: .risk-tier-template
          persist-credentials: false
          sparse-checkout: .github/risk-tiers.global.toml
          sparse-checkout-cone-mode: false
      - name: "👀 Check the reviews the tier needs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/risk-tier.py --rules .risk-tier-template/.github/risk-tiers.global.toml review --request
