# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
name: Release
on:
  release:
    types: [published]
jobs:
  release:
    outputs:
      # Handle of the file listing the artifact hashes, for the provenance generator. A file, because the list for a
      # large module no longer fits in a job output or an environment variable.
      subjects: ${{ steps.subjects.outputs.handle }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove system JDKs
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: |
            25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Set the current release version
        id: release_version
        run: echo "release_version=${GITHUB_REF:11}" >> $GITHUB_OUTPUT
      - name: Vulnerability Audit
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.release_version }}
        run: |
          release_version="${RELEASE_VERSION}"
          if [[ "${release_version}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-(M|RC)[0-9]+$ ]]; then
            echo "Running vulnerability audit in advisory mode for ${release_version}"
            VULNERABILITY_AUDIT_ENFORCEMENT=advisory .github/scripts/vulnerability-audit.sh
          else
            .github/scripts/vulnerability-audit.sh
          fi
      - name: Run pre-release
        uses: micronaut-projects/github-actions/pre-release@5f587657fc12601ab92d64d077f99a54c3cbdf78 # master
        env:
          MICRONAUT_BUILD_EMAIL: ${{ secrets.MICRONAUT_BUILD_EMAIL }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # The docs are built before publishing, so that a docs failure stops the release instead of following it.
      - name: Generate docs
        run: ./gradlew docs
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
      - name: Upload docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: build/docs
          retention-days: 5
      # The result of this job is the result of the release: once this step succeeds, the release is on Maven Central.
      # Everything after it (provenance, release assets, docs, post-release) runs in its own job, which can be re-run
      # alone and never turns the run red.
      - name: Publish to Sonatype OSSRH
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
          GPG_FILE: ${{ secrets.GPG_FILE }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
        run: |
          echo $GPG_FILE | base64 -d > secring.gpg
          # Publish both locally and to Sonatype.
          # The artifacts stored locally will be used to generate the SLSA provenance.
          ./gradlew publishToMavenCentral --publishing-type=AUTOMATIC
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-build-outputs
          path: build/repo
          retention-days: 5
      - name: Generate subjects
        continue-on-error: true
        run: |
          # Hash every file in the local publication repository.
          cd build/repo
          mapfile -d '' ARTIFACTS < <(find . -type f -printf '%P\0' | sort -z)
          if [[ ${#ARTIFACTS[@]} -eq 0 ]]; then
            echo "No publication artifacts found" >&2
            exit 1
          fi
          sha256sum -- "${ARTIFACTS[@]}" | base64 -w0 > ../../artifacts-sha256
      - name: Share subjects with the provenance generator
        id: subjects
        continue-on-error: true
        uses: slsa-framework/slsa-github-generator/actions/generator/generic/create-base64-subjects-from-file@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
        with:
          path: artifacts-sha256

  provenance:
    needs: [release]
    if: needs.release.result == 'success' && needs.release.outputs.subjects != ''
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects-as-file: "${{ needs.release.outputs.subjects }}"
      upload-assets: true # Upload to a new release.
      compile-generator: true # Build the generator from source.
      continue-on-error: true # Reported by the summary job, so that only a failed publication turns the run red.

  github_release:
    needs: [release]
    if: needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    permissions:
      contents: write # To add assets to a release.
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gradle-build-outputs
          path: build/repo
      - name: Create artifacts archive
        shell: bash
        run: |
          cd build/repo
          find . -type f -printf '%P\n' | sort | zip -q -@ ../../artifacts.zip
      - name: Upload assets
        # Upload the artifacts to the existing release. Note that the SLSA provenance will
        # attest to each artifact file and not the aggregated ZIP file.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts.zip

  docs:
    needs: [release]
    if: needs.release.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs
          path: build/docs
      - name: Set the current release version
        id: release_version
        run: echo "release_version=${GITHUB_REF:11}" >> $GITHUB_OUTPUT
      - name: Export Gradle Properties
        uses: micronaut-projects/github-actions/export-gradle-properties@5f587657fc12601ab92d64d077f99a54c3cbdf78 # master
      - name: LATEST_TAG
        run: |
          echo "LATEST_TAG=$(curl -s -L --proto '=https' --proto-redir '=https' -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')" >> $GITHUB_ENV
      - name: Publish to Github Pages
        uses: micronaut-projects/github-pages-deploy-action@76d63aafbab7108d74e83be4e5b3b0501382e829 # master
        env:
          BETA: ${{ !(github.event.release.tag_name == env.LATEST_TAG) || github.event.release.draft || github.event.release.prerelease || contains(steps.release_version.outputs.release_version, 'M') || contains(steps.release_version.outputs.release_version, 'RC') }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/docs
          VERSION: ${{ steps.release_version.outputs.release_version }}
          TARGET_REPOSITORY: ${{ github.repository == 'micronaut-projects/micronaut-core' && env.docsRepository || github.repository }}
          DEVELOCITY_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}

  # Next snapshot version and milestones. Runs whenever publishing succeeded, whatever happened to the docs or provenance.
  post_release:
    needs: [release]
    if: needs.release.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Run post-release
        uses: micronaut-projects/github-actions/post-release@5f587657fc12601ab92d64d077f99a54c3cbdf78 # master
        env:
          MICRONAUT_BUILD_EMAIL: ${{ secrets.MICRONAUT_BUILD_EMAIL }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: [release, provenance, github_release, docs, post_release]
    if: always()
    permissions:
      actions: read # To read the conclusion of each job.
    runs-on: ubuntu-latest
    steps:
      - name: Write the release summary
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.release.result }}
          PROVENANCE: ${{ needs.provenance.outputs.outcome || needs.provenance.result }}
          ASSETS: ${{ needs.github_release.result }}
          DOCS: ${{ needs.docs.result }}
          POST_RELEASE: ${{ needs.post_release.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A job with continue-on-error reports success even when a step failed, so read each job's own conclusion.
          conclusion() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
              --jq "[.jobs[] | select(.name == \"$1\") | .steps[] | .conclusion] | if any(. == \"failure\") then \"failure\" else empty end" 2>/dev/null || true
          }
          if [ "$(conclusion github_release)" = failure ]; then ASSETS=failure; fi
          if [ "$(conclusion docs)" = failure ]; then DOCS=failure; fi
          if [ "$(conclusion post_release)" = failure ]; then POST_RELEASE=failure; fi
          if [ "${PUBLISHED}" = success ] && [ "${PROVENANCE}" = skipped ]; then PROVENANCE="failure (no subjects)"; fi
          if [ "${PUBLISHED}" = success ]; then published="yes"; else published="no (${PUBLISHED})"; fi
          {
            echo "## Release ${GITHUB_REF_NAME}"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Published to Maven Central | ${published} |"
            echo "| Docs | ${DOCS} |"
            echo "| Provenance | ${PROVENANCE} |"
            echo "| Release assets | ${ASSETS} |"
            echo "| Post-release (next snapshot, milestones) | ${POST_RELEASE} |"
            echo
            echo "Re-run a failed job on its own from ${RUN_URL}."
          } >> "${GITHUB_STEP_SUMMARY}"
          for item in "Docs:${DOCS}" "Provenance:${PROVENANCE}" "Release assets:${ASSETS}" "Post-release:${POST_RELEASE}"; do
            if [[ "${item#*:}" == failure* ]]; then echo "::warning::${item%%:*} failed after publishing; re-run that job."; fi
          done
          if [ "${PUBLISHED}" != success ]; then
            echo "::error::The release was not published to Maven Central."
            exit 1
          fi
