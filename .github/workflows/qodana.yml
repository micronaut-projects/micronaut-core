# Qodana static analysis with the free Community for JVM linter, through the Gradle plugin (see qodana.yaml).
# It fails on findings that qodana-baseline.sarif.json does not list; the report is uploaded as an artifact.
name: Qodana
on:
  push:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+.x'
  pull_request:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+.x'
      # stacked PRs target each other's branches
      - 'python/**'
      - 'python-*'
      - 'stack/**'
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push to a pull request cancels its older run; pushes to a branch share one group per branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qodana:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # the linter image and the project import inside it need the room
      - name: "🗑 Free disk space"
        run: |
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf "/opt/ghc"
          sudo rm -rf "/usr/share/dotnet"
          sudo rm -rf "/usr/local/lib/android"
          sudo apt-get clean
          df -h

      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          distribution: 'graalvm'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: "🔍 Qodana"
        run: ./gradlew qodanaScan

      - name: "📤 Upload the report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qodana-report
          path: |
            build/qodana/results/report
            build/qodana/results/qodana.sarif.json
          if-no-files-found: ignore
