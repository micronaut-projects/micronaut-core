name: Client stream benchmarks (informational)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'http/src/main/java/io/micronaut/http/body/**'
      - 'json-core/src/main/java/io/micronaut/json/body/**'
      - '.github/workflows/client-stream-benchmarks.yml'
permissions:
  contents: read
concurrency:
  group: client-stream-benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Measure body publishers and JSON readers
        run: >-
          ./gradlew :benchmarks:jmh --no-daemon
          -Pjmh.includes=io.micronaut.http.body.stream.BodyPublisherBenchmark,io.micronaut.http.netty.body.JsonStreamingReadBenchmark
          -Pjmh.fork=2 -Pjmh.iterations=3 -Pjmh.warmupIterations=3
          -Pjmh.timeOnIteration=1s -Pjmh.warmupTime=1s -Pjmh.profilers=gc
      - name: Save measurements (no performance thresholds)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: client-stream-benchmarks-${{ github.sha }}
          path: benchmarks/build/results/jmh/**
          if-no-files-found: warn
      - name: Explain results
        run: |
          echo '### Informational streaming benchmarks' >> "$GITHUB_STEP_SUMMARY"
          echo 'Results are attached as artifacts. Shared-runner timing is noisy; no latency or allocation threshold is enforced. Compare like-for-like JVMs and inputs before drawing conclusions.' >> "$GITHUB_STEP_SUMMARY"
