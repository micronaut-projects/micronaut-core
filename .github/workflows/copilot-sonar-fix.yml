# Nightly: when the last commit of a maintained branch fails the SonarCloud
# quality gate, a Copilot CLI session fixes what the gate's failed conditions
# point at, and a pull request is opened for review.
#
#  - a passing gate is left alone, however many issues the new code holds
#  - only the issues and files behind the failed conditions are handed over;
#    conditions a person must handle (security hotspots) are only reported
#  - a fix may not touch build files, Gradle settings or .github/, and may not
#    delete files; it is never auto-merged
#  - no new pull request while one from this workflow is open for the branch,
#    or after one for the same findings was closed unmerged
#
# Jobs, split as in copilot-dependency-updates.yml
#  - check: reads the gate of each branch's last commit
#  - fix: the Copilot session; no repository token, only produces a patch
#  - publish: a clean runner applies the patch, checks it and opens the PR
#
# Secrets: COPILOT_GITHUB_TOKEN and DEPENDENCY_UPDATES_TOKEN, as in
# copilot-dependency-updates.yml, and SONAR_TOKEN, the token Java CI analyses
# with. Only the check job gets SONAR_TOKEN; the Copilot session never does.
name: Copilot Sonar fix
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: 'Comma separated branches (default: the default branch, newer X.Y.x branches and the previous release line)'
        required: false
      model:
        description: 'Copilot model (default: the CLI default)'
        required: false
      dry-run:
        description: 'Fix, verify and check, but push nothing'
        type: boolean
        default: false
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check:
    if: github.repository_owner == 'micronaut-projects'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: "📥 Checkout workflow tooling"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: "🔎 Read the quality gate of each branch"
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          BASE_BRANCHES: ${{ inputs.branches }}
        run: python3 .github/scripts/copilot-sonar.py plan

  fix:
    name: "fix ${{ matrix.id }}"
    needs: check
    if: needs.check.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - name: "🗑 Free disk space"
        run: |
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/ghc /usr/share/dotnet /usr/local/lib/android
          sudo apt-get clean

      # the commit the gate failed on, not whatever the branch has moved to
      - name: "📥 Checkout ${{ matrix.base }}@${{ matrix.sha }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false

      - name: "📥 Checkout workflow tooling"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .copilot-tools
          sparse-checkout: .github
          persist-credentials: false

      - name: "📌 Prepare"
        run: |
          mv .copilot-tools "$RUNNER_TEMP/tools"
          mkdir -p "$RUNNER_TEMP/out" build/copilot-sonar

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          distribution: 'graalvm'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: "🔧 Install Copilot CLI"
        run: npm install -g @github/copilot@1

      - name: "🤖 Fix with Copilot"
        continue-on-error: true
        timeout-minutes: 120
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TASK: ${{ toJSON(matrix) }}
          MODEL: ${{ inputs.model }}
          # inside the workspace, where Copilot may write; build/ is ignored by git
          REPORT: build/copilot-sonar/report.md
        run: |
          python3 "$RUNNER_TEMP/tools/.github/scripts/copilot-sonar.py" prompt > "$RUNNER_TEMP/out/prompt.md"
          copilot -p "$(cat "$RUNNER_TEMP/out/prompt.md")" \
            ${MODEL:+--model "$MODEL"} \
            --no-ask-user \
            --share "$RUNNER_TEMP/out/session.md" \
            --allow-tool=write \
            --allow-tool='shell(./gradlew:*)' \
            --allow-tool='shell(grep:*)' \
            --allow-tool='shell(find:*)' \
            --allow-tool='shell(ls:*)' \
            --allow-tool='shell(cat:*)' \
            --allow-tool='shell(git diff:*)' \
            --allow-tool='shell(git status:*)' \
            --allow-tool='shell(git log:*)' \
            --allow-tool='shell(git show:*)' \
            --allow-tool='shell(git checkout:*)' \
            --deny-tool='shell(git push)' \
            --deny-tool='shell(git commit)' \
            2>&1 | tee "$RUNNER_TEMP/out/copilot.log"

      - name: "🛠 Verify"
        id: verify
        continue-on-error: true
        run: |
          tasks=$(jq -r .verifyTasks "$RUNNER_TEMP/tools/.github/copilot-policy.json")
          ./gradlew $tasks --no-daemon --continue

      - name: "📦 Save the change"
        env:
          BASE_SHA: ${{ matrix.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          cp build/copilot-sonar/report.md "$RUNNER_TEMP/out/report.md" 2>/dev/null || true
          echo "$VERIFY_OUTCOME" > "$RUNNER_TEMP/out/verify"
          git add -A
          git diff --cached --binary "$BASE_SHA" > "$RUNNER_TEMP/out/change.patch"
          git diff --cached --stat "$BASE_SHA"

      - name: "📤 Upload the change"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/out
          retention-days: 14

  publish:
    name: "publish ${{ matrix.id }}"
    needs: [check, fix]
    if: always() && needs.check.outputs.count != '0' && needs.check.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - name: "📥 Download the change"
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/in

      - name: "📥 Checkout ${{ matrix.base }}"
        if: steps.download.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.base }}
          fetch-depth: 50
          persist-credentials: false

      - name: "📥 Checkout workflow tooling"
        if: steps.download.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .copilot-tools
          sparse-checkout: .github
          persist-credentials: false

      - name: "🩹 Apply the change"
        if: steps.download.outcome == 'success'
        id: apply
        run: |
          mv .copilot-tools "$RUNNER_TEMP/tools"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -s "$RUNNER_TEMP/in/change.patch" ]; then
            git apply --3way --index --binary "$RUNNER_TEMP/in/change.patch"
          fi

      - name: "⚖️ Check the fix"
        if: steps.download.outcome == 'success'
        id: classify
        env:
          BASE_REF: ${{ steps.apply.outputs.sha }}
          TASK: ${{ toJSON(matrix) }}
        run: |
          export VERIFY_OUTCOME=$(cat "$RUNNER_TEMP/in/verify" 2>/dev/null || echo failure)
          python3 "$RUNNER_TEMP/tools/.github/scripts/copilot-sonar.py" classify

      - name: "📤 Push and open the pull request"
        if: >-
          steps.download.outcome == 'success' && !inputs.dry-run &&
          contains(fromJSON('["review","failed"]'), steps.classify.outputs.status)
        env:
          GH_TOKEN: ${{ secrets.DEPENDENCY_UPDATES_TOKEN }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
          STATUS: ${{ steps.classify.outputs.status }}
          TITLE: ${{ steps.classify.outputs.title }}
          CHANGES: ${{ steps.classify.outputs.changes }}
          REASONS: ${{ steps.classify.outputs.reasons }}
          CONDITIONS: ${{ join(matrix.conditions, '; ') }}
          MANUAL: ${{ join(matrix.manual, ', ') }}
          SHA: ${{ matrix.sha }}
          DASHBOARD: ${{ matrix.dashboard }}
          FINGERPRINT: ${{ matrix.fingerprint }}
          COMMIT_EMAIL: ${{ vars.DEPENDENCY_UPDATES_EMAIL || 'micronaut-build@users.noreply.github.com' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY_FILE: ${{ runner.temp }}/body.md
          COMMIT_BODY: "SonarCloud quality gate failed on ${{ matrix.sha }}: ${{ join(matrix.conditions, '; ') }}"
          LABEL_PREFIX: copilot-sonar
        run: |
          {
            echo "<!-- copilot-sonar fingerprint=$FINGERPRINT -->"
            echo "The [SonarCloud quality gate]($DASHBOARD) fails on \`$SHA\`: $CONDITIONS."
            echo "Copilot prepared this fix; it always needs review."
            [ -n "$MANUAL" ] && echo && echo "Left for a person: $MANUAL."
            echo
            echo "$REASONS"
            echo
            echo "$CHANGES"
            echo
            echo "## Copilot report"
            echo
            cat "$RUNNER_TEMP/in/report.md" 2>/dev/null || echo "_Copilot wrote no report; see the workflow run._"
            echo
            echo "---"
            echo "[Workflow run]($RUN_URL)"
          } > "$BODY_FILE"
          bash "$RUNNER_TEMP/tools/.github/scripts/copilot-open-pr.sh"
