name: Crema CI
# Runs the native tests of test-suite-crema-graalvm: service loading in a native image built with
# runtime class loading (Crema, -H:+RuntimeClassLoading). Crema is experimental, and what it supports
# changes between GraalVM releases, so the module only has a nativeTest task with -PcremaTests=true, and
# the GraalVM workflows, which run every nativeTest task of the build, do not run it. This workflow runs
# it on the GraalVM release the tests were verified with. Unlike the GraalVM workflows, this file is not
# synced from micronaut-project-template.
on:
  pull_request:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+.x'
    types: [opened, synchronize, reopened, ready_for_review]
    # The module's tests depend on micronaut-core only: these are the sources they exercise.
    paths:
      - 'core/src/main/java/io/micronaut/core/io/service/**'
      - 'core/src/main/java/io/micronaut/core/util/NativeImageUtils.java'
      - 'core/src/main/resources/META-INF/native-image/**'
      - 'test-suite-crema-graalvm/**'
      - '.github/workflows/crema.yml'
  schedule:
    - cron: "0 3 * * 0" # Sundays at 3am UTC
  workflow_dispatch:
    inputs:
      java-version:
        description: "Oracle GraalVM to test with, as the java-version of graalvm/setup-graalvm (for example 25.0.3, or 25 for the latest release)"
        required: false
        default: '25.0.3'
        type: string
# A new push to a pull request cancels its older run. Scheduled and manual runs get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  native_test:
    name: "nativeTest"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The Oracle GraalVM release the Crema tests were last verified with, see test-suite-crema-graalvm/README.md.
      # Change it together with the README when the tests are verified with another release.
      GRAALVM_JAVA_VERSION: ${{ inputs.java-version || '25.0.3' }}
      TESTCONTAINERS_RYUK_DISABLED: true
      # This workflow has no push trigger, so like the pull request builds of gradle.yml it only reads the
      # remote build cache. Set explicitly: the setup-gradle token makes the micronaut-build settings plugin
      # detect CI, which would otherwise push.
      ORG_GRADLE_PROJECT_cachePush: false
    steps:
      # https://github.com/actions/virtual-environments/issues/709
      - name: "Remove system JDKs"
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)
      - name: "🗑 Free disk space"
        run: |
         sudo rm -rf "/usr/local/share/boost"
         sudo rm -rf "$AGENT_TOOLSDIRECTORY"
         sudo rm -rf "/opt/ghc"
         sudo rm -rf "/usr/share/dotnet"
         sudo rm -rf "/usr/local/lib/android"
         sudo apt-get clean
         df -h

      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: "🔧 Setup Oracle GraalVM ${{ env.GRAALVM_JAVA_VERSION }}"
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          distribution: 'graalvm'
          java-version: ${{ env.GRAALVM_JAVA_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # Exchanged for a short-lived token that the following steps receive as DEVELOCITY_ACCESS_KEY and
          # GRADLE_ENTERPRISE_ACCESS_KEY, so the long-lived key never reaches the build. As for the pull requests
          # of gradle.yml: DEVELOCITY_PULL_REQUEST_ACCESS_KEY, a key whose Develocity user cannot write to the
          # build cache, with the writer key as the fallback until that secret exists.
          develocity-access-key: ${{ secrets.DEVELOCITY_PULL_REQUEST_ACCESS_KEY || secrets.GRADLE_ENTERPRISE_ACCESS_KEY || '' }}

      - name: "❓ Optional setup step"
        run: |
          [ -f ./setup.sh ] && ./setup.sh || [ ! -f ./setup.sh ]

      - name: "🛠 Run the Crema native tests with Gradle"
        env:
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GRAALVM_QUICK_BUILD: true
          NATIVE_IMAGE_OPTIONS: "-H:+ReportExceptionStackTraces"
        run: |
          ./gradlew :test-suite-crema-graalvm:nativeTest -PcremaTests=true --no-daemon --continue

      - name: "📊 Publish Test Report"
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        with:
          check_name: Crema CI / Test Report (${{ env.GRAALVM_JAVA_VERSION }})
          report_paths: 'test-suite-crema-graalvm/build/test-results/test-native/TEST-*.xml'
          check_retries: 'true'

      - name: "❓ Optional cleanup step"
        run: |
          [ -f ./cleanup.sh ] && ./cleanup.sh || [ ! -f ./cleanup.sh ]
