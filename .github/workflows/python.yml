# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
name: Python CI
# Runs the Python test suites of the module on GraalVM. Python tests are skipped by
# the regular Java CI: the `io.micronaut.build.internal.python` build plugin only runs them when
# the `python-ci` Gradle property is set, and registers the root `pythonCheck` task run here.
# Does nothing for modules without a project applying that plugin.
on:
  push:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+.x'
  pull_request:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+.x'
      # stacked Python fix PRs target each other's branches
      - 'python/**'
      - 'python-*'
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a pull request cancels its older run, freeing the shared runner
# pool. Pushes to branches get a group of their own and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  detect:
    name: "detect"
    if: github.repository != 'micronaut-projects/micronaut-project-template' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: "🔍 Detect Python projects"
        id: detect
        # Projects with Python sources apply the io.micronaut.build.internal.python plugin, either
        # directly in their build script or through a convention plugin of buildSrc.
        run: |
          if grep -rlq --include='*.gradle' --include='*.gradle.kts' --exclude-dir=build --exclude-dir=.gradle \
              'io.micronaut.build.internal.python' .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No project applies the io.micronaut.build.internal.python plugin, nothing to do"
          fi
  build:
    name: "build"
    needs: detect
    if: needs.detect.outputs.present == 'true'
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
      ORG_GRADLE_PROJECT_cachePush: ${{ github.event_name == 'push' }}
    steps:
       # https://github.com/actions/virtual-environments/issues/709
      - name: Remove system JDKs
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)
      - name: "🗑 Free disk space"
        run: |
         sudo rm -rf "/usr/local/share/boost"
         sudo rm -rf "$AGENT_TOOLSDIRECTORY"
         sudo rm -rf "/opt/ghc"
         sudo rm -rf "/usr/share/dotnet"
         sudo rm -rf "/usr/local/lib/android"
         sudo apt-get clean
         df -h

      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          distribution: 'graalvm'
          java-version: '25'
          version: '25.3'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          develocity-access-key: >-
            ${{ (github.event_name == 'push' && secrets.GRADLE_ENTERPRISE_ACCESS_KEY) ||
                (github.event_name != 'push' && (secrets.DEVELOCITY_PULL_REQUEST_ACCESS_KEY || secrets.GRADLE_ENTERPRISE_ACCESS_KEY)) ||
                '' }}

      - name: "❓ Optional setup step"
        run: |
          [ -f ./setup.sh ] && ./setup.sh || [ ! -f ./setup.sh ]

      - name: "🐍 Build the Python test suite with Gradle"
        env:
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          ./gradlew pythonCheck -Ppython-ci --no-daemon --continue

      - name: "📊 Publish Test Report"
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        with:
          check_name: Python CI / Test Report
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_retries: 'true'

      - name: "❓ Optional cleanup step"
        run: |
          [ -f ./cleanup.sh ] && ./cleanup.sh || [ ! -f ./cleanup.sh ]
