# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
name: Review policy
# Re-runs the review-policy check of risk-tier.yml when a review is submitted or dismissed. The job has the same name,
# so the latest result is the one that counts. It only reads: the review request to the maintainers rotation is made
# by risk-tier.yml. The policy is described in MAINTAINING.md, under "Review policy".
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

concurrency:
  group: review-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-policy:
    name: review-policy
    if: github.repository_owner == 'micronaut-projects'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: "📥 Checkout base branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The base branch, never the pull request head.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/risk-tier.py
            .github/risk-tiers.toml
            .github/CODEOWNERS
            CODEOWNERS
            docs/CODEOWNERS
          sparse-checkout-cone-mode: false
      - name: "📥 Fetch the global rules from the template"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: micronaut-projects/micronaut-project-template
          ref: master
          path: .risk-tier-template
          persist-credentials: false
          sparse-checkout: .github/risk-tiers.global.toml
          sparse-checkout-cone-mode: false
      - name: "👀 Check the reviews the tier needs"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/risk-tier.py --rules .risk-tier-template/.github/risk-tiers.global.toml review
