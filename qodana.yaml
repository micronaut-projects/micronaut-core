# Qodana static analysis with the free Community for JVM linter: ./gradlew qodanaScan (needs Docker).
# Results go to build/qodana/results. qodana-baseline.sarif.json lists the findings accepted for now: the scan fails only on
# findings it does not list. To accept the current findings: ./gradlew qodanaScan, then copy
# build/qodana/results/qodana.sarif.json over qodana-baseline.sarif.json (minifying it is fine). Keep the whole report:
# inserting lines in a file changes the fingerprints of the findings below them, and Qodana then matches them by the
# code snippets of the report; a baseline without them reports every such finding as new.
# On Linux, where the container shares the host's file locks, run it as
# ./gradlew --project-cache-dir /tmp/gradle-project-cache qodanaScan: the linter imports the project with Gradle on
# the checkout's .gradle directory, and this build's locks there would stall that import.
version: "1.0"
image: jetbrains/qodana-jvm-community:2026.2
projectJDK: "25"
profile:
  name: qodana.recommended
failThreshold: 0
exclude:
  - name: All
    paths:
      - benchmarks
      - buildSrc
      - config
  # NullAway checks nullness when the code compiles, under JSpecify's @NullMarked
  - name: NullableProblems
