import org.gradle.internal.component.external.model.ModuleComponentArtifactIdentifier

import java.nio.file.FileVisitResult
import java.nio.file.Files
import java.nio.file.SimpleFileVisitor
import java.nio.file.StandardCopyOption
import java.security.MessageDigest

plugins {
   id("java")
}

repositories {
// %REPOSITORIES%
}

dependencies {
// %DEPENDENCIES%
}

tasks.register("resolvePyronautDependencies", DependencyDownloader) {
    root = configurations.runtimeClasspath.incoming.artifacts
    outputDirectory = file("%DESTINATION_DIR%")
}

abstract class DependencyDownloader extends DefaultTask {
    @Internal
    abstract SetProperty<ResolvedArtifactResult> getRoot()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @InputFiles
    protected List<File> getFiles() {
        return getRoot().get().stream()
            .map(ResolvedArtifactResult::getFile)
            .toList()
    }

    @TaskAction
    void download() {
        def outputDir = getOutputDirectory().get().asFile.toPath()
        def prefixes = [] as Set
        for (def artifactResult in root.get()) {
            def id = artifactResult.id
            if (id instanceof ModuleComponentArtifactIdentifier) {
                def path = "${id.componentIdentifier.group}/${id.componentIdentifier.module}/${id.componentIdentifier.version}".toString()
                prefixes << path
                def targetPath = outputDir.resolve(path)
                def src = artifactResult.file.toPath()
                def targetFile = targetPath.resolve(artifactResult.file.name)
                def hash = { file ->
                    def md = MessageDigest.getInstance("SHA1")
                    md.update(Files.readAllBytes(file))
                    return md.digest()
                }

                Files.createDirectories(targetPath)

                if (!Files.exists(targetFile) || !Arrays.equals(hash(src), hash(targetFile))) {
                    Files.copy(src, targetFile, StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }

        // Remove stale directories
        if (Files.exists(outputDir)) {
                Files.walkFileTree(outputDir, new SimpleFileVisitor<java.nio.file.Path>() {
                    @Override
                    FileVisitResult postVisitDirectory(java.nio.file.Path dir, IOException exc) throws IOException {
                        def rel = outputDir.relativize(dir).toString()
                        def parts = rel.split(/[\\/]/)
                        if (parts.length == 3) {
                            def prefix = parts.join('/')
                            if (!prefixes.contains(prefix)) {
                                // Delete entire subtree
                                Files.walk(dir)
                                    .sorted(Comparator.reverseOrder())
                                    .forEach { p -> Files.deleteIfExists(p) }
                            }
                        }

                        return FileVisitResult.CONTINUE
                    }
                })
            }
    }
}
